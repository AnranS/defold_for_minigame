<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">What happens at export time and at run time</title>
<desc id="figure-description">At export time the tool reads the Defold HTML5 bundle, verifies sizes, hashes, WebAssembly features, and the loader's structure, composes dmloader.js and the engine glue verbatim into one scoped module, and writes a main package and an engine subpackage. At run time there are four layers, top to bottom: your game; the Defold engine, run verbatim; the adapter this project provides; and the host, wx, tt, or TTMinis.game.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5bb4ff"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9ca9bb"/></marker>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5bb4ff"/><stop offset="1" stop-color="#ffa24d"/></linearGradient>
</defs>
