<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">One SDK call across the Lua bridge</title>
<desc id="figure-description">Step 1: minigame.login hands a JSON command to the bridge through html5.run; its id carries the name of this Lua state. Step 2: the bridge calls the host's wx.login. Step 3: the host's success callback puts the result in a queue. Step 4: minigame.update asks for its own results with a poll command once per frame. Step 5: your callback receives the login code.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5bb4ff"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9ca9bb"/></marker>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5bb4ff"/><stop offset="1" stop-color="#ffa24d"/></linearGradient>
</defs>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .caps { letter-spacing: 0.08em; }</style>
<rect x="0.5" y="0.5" width="1199" height="593" rx="24" fill="#0b1018" stroke="#1c2533" stroke-width="1"/>
<path d="M180 104V518" stroke="#263243" stroke-width="1.5" stroke-dasharray="4 6" fill="none"/>
<rect x="40" y="44" width="280" height="60" rx="14" fill="#111824" stroke="#263243" stroke-width="1"/>
<text x="180" y="71" font-size="17" font-weight="650" fill="#f5f7fb" text-anchor="middle">Lua script</text>
<text x="180" y="91" font-size="12.5" fill="#68778b" text-anchor="middle" class="mono">minigame.lua</text>
<path d="M600 104V518" stroke="#263243" stroke-width="1.5" stroke-dasharray="4 6" fill="none"/>
<rect x="460" y="44" width="280" height="60" rx="14" fill="#111824" stroke="#263243" stroke-width="1"/>
<text x="600" y="71" font-size="17" font-weight="650" fill="#f5f7fb" text-anchor="middle">Lua bridge</text>
<text x="600" y="91" font-size="12.5" fill="#68778b" text-anchor="middle" class="mono">js/bridge.js</text>
<path d="M1020 104V518" stroke="#263243" stroke-width="1.5" stroke-dasharray="4 6" fill="none"/>
<rect x="880" y="44" width="280" height="60" rx="14" fill="#111824" stroke="#263243" stroke-width="1"/>
<text x="1020" y="71" font-size="17" font-weight="650" fill="#f5f7fb" text-anchor="middle">Host</text>
<text x="1020" y="91" font-size="12.5" fill="#68778b" text-anchor="middle" class="mono">WeChat here: wx</text>
<path d="M196 168H590" fill="none" stroke="#5bb4ff" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="180" cy="168" r="11" fill="#0b1018" stroke="#5bb4ff" stroke-width="1.5"/>
<text x="180" y="172.5" font-size="12.5" font-weight="650" fill="#5bb4ff" text-anchor="middle">1</text>
<text x="390" y="156" font-size="13" fill="#f5f7fb" text-anchor="middle" class="mono">{&quot;op&quot;:&quot;call&quot;,&quot;api&quot;:&quot;login&quot;,&quot;id&quot;:&quot;c1:1&quot;}</text>
<text x="390" y="190" font-size="13" fill="#9ca9bb" text-anchor="middle">minigame.login(callback), sent with html5.run()</text>
<path d="M616 244H1010" fill="none" stroke="#5bb4ff" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="600" cy="244" r="11" fill="#0b1018" stroke="#5bb4ff" stroke-width="1.5"/>
<text x="600" y="248.5" font-size="12.5" font-weight="650" fill="#5bb4ff" text-anchor="middle">2</text>
<text x="810" y="232" font-size="13" fill="#f5f7fb" text-anchor="middle" class="mono">wx.login({ success, fail })</text>
<text x="810" y="266" font-size="13" fill="#9ca9bb" text-anchor="middle">the bridge calls the host API</text>
<path d="M1004 320H610" fill="none" stroke="#9ca9bb" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#arrow-muted)"/>
<circle cx="1020" cy="320" r="11" fill="#0b1018" stroke="#9ca9bb" stroke-width="1.5"/>
<text x="1020" y="324.5" font-size="12.5" font-weight="650" fill="#9ca9bb" text-anchor="middle">3</text>
<text x="810" y="308" font-size="13" fill="#f5f7fb" text-anchor="middle" class="mono">success({ code })</text>
<text x="810" y="342" font-size="13" fill="#9ca9bb" text-anchor="middle">the result is queued, the engine is not interrupted</text>
<path d="M196 396H590" fill="none" stroke="#5bb4ff" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="180" cy="396" r="11" fill="#0b1018" stroke="#5bb4ff" stroke-width="1.5"/>
<text x="180" y="400.5" font-size="12.5" font-weight="650" fill="#5bb4ff" text-anchor="middle">4</text>
<text x="390" y="384" font-size="13" fill="#f5f7fb" text-anchor="middle" class="mono">{&quot;op&quot;:&quot;poll&quot;,&quot;client&quot;:&quot;c1&quot;}</text>
<text x="390" y="418" font-size="13" fill="#9ca9bb" text-anchor="middle">minigame.update() asks for its results every frame</text>
<path d="M584 472H190" fill="none" stroke="#9ca9bb" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#arrow-muted)"/>
<circle cx="600" cy="472" r="11" fill="#0b1018" stroke="#9ca9bb" stroke-width="1.5"/>
<text x="600" y="476.5" font-size="12.5" font-weight="650" fill="#9ca9bb" text-anchor="middle">5</text>
<text x="390" y="460" font-size="13" fill="#f5f7fb" text-anchor="middle" class="mono">[{&quot;id&quot;:&quot;c1:1&quot;,&quot;ok&quot;:true,&quot;data&quot;:{&quot;code&quot;:&quot;…&quot;}}]</text>
<text x="390" y="494" font-size="13" fill="#9ca9bb" text-anchor="middle">your callback receives callback(code, nil)</text>
<text x="600" y="562" font-size="13.5" fill="#68778b" text-anchor="middle">In a browser html5.run() is eval. Mini games disable eval, so the export redirects that one call to the bridge, which accepts JSON commands only.</text>
</svg>
