<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 488" width="1200" height="488" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">What an export contains</title>
<desc id="figure-description">The main package holds only the entry, the configuration, the adapter, and the engine module: about 0.42 MB of a 4 MB limit. The engine subpackage holds the stock engine compressed with Brotli (2.89 MB down to 0.92 MB) and the game archive. Total limit: WeChat 30 MB  ·  Douyin 20 MB  ·  TikTok 30 MB.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5bb4ff"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9ca9bb"/></marker>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5bb4ff"/><stop offset="1" stop-color="#ffa24d"/></linearGradient>
</defs>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .caps { letter-spacing: 0.08em; }</style>
<rect x="0.5" y="0.5" width="1199" height="487" rx="24" fill="#0b1018" stroke="#1c2533" stroke-width="1"/>
<rect x="48" y="48" width="540" height="344" rx="14" fill="#111824" stroke="#263243" stroke-width="1"/>
<text x="74" y="84" font-size="12" font-weight="600" fill="#ffa24d" class="caps">MAIN PACKAGE</text>
<text x="74" y="116" font-size="20" font-weight="650" fill="#f5f7fb">Glue and runtime</text>
<text x="74" y="156" font-size="14.5" fill="#f5f7fb" class="mono">game.js</text>
<text x="562" y="156" font-size="14" fill="#9ca9bb" text-anchor="end">entry</text>
<text x="74" y="187" font-size="14.5" fill="#f5f7fb" class="mono">game.json</text>
<text x="562" y="187" font-size="14" fill="#9ca9bb" text-anchor="end">config, declares the subpackage</text>
<text x="74" y="218" font-size="14.5" fill="#f5f7fb" class="mono">adapter.js</text>
<text x="562" y="218" font-size="14" fill="#9ca9bb" text-anchor="end">browser environment adapter</text>
<text x="74" y="249" font-size="14.5" fill="#f5f7fb" class="mono">js/defold_engine.js</text>
<text x="562" y="249" font-size="14" fill="#9ca9bb" text-anchor="end">dmloader.js and the engine glue</text>
<text x="74" y="280" font-size="14.5" fill="#f5f7fb" class="mono">js/loader.js, bridge.js, …</text>
<text x="562" y="280" font-size="14" fill="#9ca9bb" text-anchor="end">boot, Lua bridge, saves</text>
<text x="74" y="337" font-size="14" font-weight="600" fill="#f5f7fb">about 0.42 MB</text>
<text x="562" y="337" font-size="13" fill="#68778b" text-anchor="end">main package limit 4 MB</text>
<rect x="74" y="347" width="488" height="10" rx="5" fill="#1c2533"/>
<rect x="74" y="347" width="51" height="10" rx="5" fill="#5bb4ff"/>
<rect x="612" y="48" width="540" height="344" rx="14" fill="#111824" stroke="#263243" stroke-width="1"/>
<text x="638" y="84" font-size="12" font-weight="600" fill="#ffa24d" class="caps">ENGINE SUBPACKAGE</text>
<text x="638" y="116" font-size="20" font-weight="650" fill="#f5f7fb">The engine and your game's assets</text>
<text x="638" y="156" font-size="14.5" fill="#f5f7fb" class="mono">engine/dmengine.wasm.br</text>
<text x="1126" y="156" font-size="14" fill="#9ca9bb" text-anchor="end">stock engine, Brotli</text>
<text x="638" y="187" font-size="14.5" fill="#f5f7fb" class="mono">engine/archive/*.bin</text>
<text x="1126" y="187" font-size="14" fill="#9ca9bb" text-anchor="end">game archive: your assets</text>
<text x="638" y="218" font-size="14.5" fill="#f5f7fb" class="mono">engine/game.js</text>
<text x="1126" y="218" font-size="14" fill="#9ca9bb" text-anchor="end">subpackage entry</text>
<text x="638" y="275" font-size="14" font-weight="600" fill="#f5f7fb">engine binary 2.89 MB</text>
<text x="1126" y="275" font-size="13" fill="#68778b" text-anchor="end">before compression</text>
<rect x="638" y="285" width="488" height="10" rx="5" fill="#1c2533"/>
<rect x="638" y="285" width="488" height="10" rx="5" fill="#3a475a"/>
<text x="638" y="325" font-size="14" font-weight="600" fill="#f5f7fb">0.92 MB</text>
<text x="1126" y="325" font-size="13" fill="#68778b" text-anchor="end">after Brotli: this is what ships</text>
<rect x="638" y="335" width="488" height="10" rx="5" fill="#1c2533"/>
<rect x="638" y="335" width="155" height="10" rx="5" fill="#ffa24d"/>
<text x="600" y="432" font-size="15" fill="#9ca9bb" text-anchor="middle">Total limit: WeChat 30 MB  ·  Douyin 20 MB  ·  TikTok 30 MB</text>
<text x="600" y="458" font-size="13" fill="#68778b" text-anchor="middle">Figures from an export of the stock Defold 1.14.1 engine; the archive depends on your game</text>
</svg>
