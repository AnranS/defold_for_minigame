<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">From a Defold HTML5 bundle to three mini-game platforms</title>
<desc id="figure-description">The HTML5 bundle Defold writes (dmloader.js, the engine glue, the engine binary, the archive) goes through one defold-minigame export command and becomes a WeChat, Douyin, or TikTok mini-game project.</desc>
